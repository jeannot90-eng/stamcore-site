<script>
  // Header: subtiele schaduw/achtergrond zodra je scrolt
  const navbar = document.querySelector('[data-navbar]');
  const onScroll = () => {
    if (window.scrollY > 16) {
      navbar.classList.add('border-white/10', 'shadow-lg', 'shadow-slate-950/50');
    } else {
      navbar.classList.remove('border-white/10', 'shadow-lg', 'shadow-slate-950/50');
    }
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // Mobiel menu open/dicht
  const menuBtn = document.querySelector('[data-menu-btn]');
  const mobileMenu = document.querySelector('[data-mobile-menu]');
  menuBtn.addEventListener('click', () => {
    const open = mobileMenu.classList.toggle('hidden') === false;
    menuBtn.setAttribute('aria-expanded', String(open));
  });
  mobileMenu.querySelectorAll('a').forEach((a) => {
    a.addEventListener('click', () => {
      mobileMenu.classList.add('hidden');
      menuBtn.setAttribute('aria-expanded', 'false');
    });
  });

  // "Meer"-menu: dicht bij klik ernaast of op Escape
  const moreMenu = document.querySelector('[data-more-menu]');
  if (moreMenu) {
    document.addEventListener('click', (e) => { if (!moreMenu.contains(e.target)) moreMenu.open = false; });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') moreMenu.open = false; });
  }

  // Reveal-on-scroll
  const reveals = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.12 });
    reveals.forEach((el) => io.observe(el));
  } else {
    reveals.forEach((el) => el.classList.add('in'));
  }
</script>
